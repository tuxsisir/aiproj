{% with u=email.summary.urgency %}
<span class="shrink-0 px-2 py-0.5 rounded text-[11px] font-medium border
  {% if u == 'urgent' %}bg-rose-50 text-rose-700 border-rose-200 dark:bg-rose-950/40 dark:text-rose-300 dark:border-rose-800
  {% elif u == 'high' %}bg-amber-50 text-amber-700 border-amber-200 dark:bg-amber-950/40 dark:text-amber-300 dark:border-amber-800
  {% else %}bg-slate-100 text-slate-600 border-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700{% endif %}">
  {{ u|capfirst }}
</span>
{% endwith %}
