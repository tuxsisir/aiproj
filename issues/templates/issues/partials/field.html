<div>
  <label
    for="{{ field.id_for_label }}"
    class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300"
  >{{ field.label }}</label>
  {% if field|is_select %}<c-listbox :field="field" />{% else %}{{ field }}{% endif %}
  {% for error in field.errors %}<p class="mt-1 text-sm text-rose-600 dark:text-rose-400">{{ error }}</p>{% endfor %}
</div>
