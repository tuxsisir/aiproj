<span class="inline-flex shrink-0 items-center rounded-full px-2 py-0.5 text-[11px] font-semibold
  {% if issue.status == 'OPEN' %}bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300
  {% elif issue.status == 'IN_PROGRESS' %}bg-sky-100 text-sky-800 dark:bg-sky-950/60 dark:text-sky-300
  {% elif issue.status == 'RESOLVED' %}bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300
  {% else %}bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300{% endif %}"
>{% if issue.status == 'OPEN' %}No response yet{% else %}{{ issue.get_status_display }}{% endif %}</span>
