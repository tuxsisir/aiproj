<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Project</title>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
    
    <nav class="bg-white border-b border-gray-200 p-4 flex justify-between items-center">
        <a href="{% url 'landing' %}" class="font-bold text-lg">Base Project</a>
        <div class="space-x-4">
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="hover:underline">Dashboard</a>
                <a href="{% url 'profile_edit' %}" class="hover:underline">Profile</a>
                <form method="post" action="{% url 'account_logout' %}" class="inline-block">
                    {% csrf_token %}
                    <button type="submit" class="hover:underline text-red-600">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'account_login' %}" class="hover:underline">Log in</a>
                <a href="{% url 'account_signup' %}" class="hover:underline">Sign up</a>
            {% endif %}
        </div>
    </nav>

    <main class="p-8 max-w-5xl mx-auto">
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
