{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
    <head>
        {% tailwind_css %}
        <script>
            if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        </script>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>StrataCorp - Dashboard</title>
        <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    </head>
    <body class="bg-background text-foreground antialiased min-h-screen flex selection:bg-blue-500/30">

        <!-- Sidebar -->
        <aside class="hidden md:flex flex-col w-64 border-r border-border bg-card p-6 h-screen sticky top-0">
            <div class="flex items-center gap-3 mb-8 text-xl font-bold tracking-tight">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-emerald-500 flex items-center justify-center shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </div>
                StrataCorp
            </div>

            <nav class="space-y-2 flex-1">
                <a href="{% url 'dashboard_demo' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-md {% if request.resolver_match.url_name == 'dashboard_demo' %}bg-secondary text-foreground shadow-sm border-border{% else %}hover:bg-secondary/50 text-muted-foreground hover:text-foreground border-transparent{% endif %} text-sm font-medium transition-colors border">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
                    Dashboard
                </a>
                <a href="{% url 'documents' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-md {% if request.resolver_match.url_name == 'documents' %}bg-secondary text-foreground shadow-sm border-border{% else %}hover:bg-secondary/50 text-muted-foreground hover:text-foreground border-transparent{% endif %} text-sm font-medium transition-colors border">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Documents
                </a>
                <a href="{% url 'queries' %}" class="flex items-center gap-3 px-3 py-2.5 rounded-md {% if request.resolver_match.url_name == 'queries' %}bg-secondary text-foreground shadow-sm border-border{% else %}hover:bg-secondary/50 text-muted-foreground hover:text-foreground border-transparent{% endif %} text-sm font-medium transition-colors border">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Resident Queries
                </a>
            </nav>

            <div class="mt-auto pt-4 border-t border-border flex items-center gap-3">
                <div class="w-9 h-9 rounded-full bg-zinc-200 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 flex items-center justify-center font-semibold text-xs text-zinc-900 dark:text-zinc-100">MU</div>
                <div class="text-sm">
                    <p class="font-medium">Manager User</p>
                    <p class="text-xs text-muted-foreground">Admin</p>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden">
            <!-- Header -->
            <header class="h-16 border-b border-border flex items-center px-6 md:px-8 bg-background/95 backdrop-blur supports-[backdrop-filter]:bg-background/60 z-10 transition-all">
                <h1 class="text-xl font-semibold text-foreground flex items-center gap-3">
                    Fleetwood Gardens
                    <span class="text-xs font-medium text-blue-400 bg-blue-950/50 border border-blue-900/50 px-2.5 py-0.5 rounded-full">LMS 4422</span>
                </h1>
                <a href="{% url 'landing' %}" class="ml-auto text-sm text-muted-foreground hover:text-foreground underline underline-offset-4 transition-colors">Back to Landing</a>
            </header>

            <div class="flex-1 overflow-y-auto p-6 md:p-8 flex flex-col lg:flex-row gap-8 bg-zinc-50 dark:bg-zinc-950/30">
                {% block content %}
                {% endblock %}
            </div>
        </main>

        <!-- Theme Toggle -->
        <button id="theme-toggle" class="fixed bottom-6 right-6 z-50 p-3 rounded-full bg-secondary text-secondary-foreground border border-border shadow-lg transition-transform hover:scale-110 focus:outline-none focus:ring-2 focus:ring-ring" aria-label="Toggle Dark Mode">
            <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
        <script>
            var themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
            var themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

            if (document.documentElement.classList.contains('dark')) {
                themeToggleLightIcon.classList.remove('hidden');
            } else {
                themeToggleDarkIcon.classList.remove('hidden');
            }

            var themeToggleBtn = document.getElementById('theme-toggle');

            themeToggleBtn.addEventListener('click', function() {
                themeToggleDarkIcon.classList.toggle('hidden');
                themeToggleLightIcon.classList.toggle('hidden');

                if (localStorage.getItem('color-theme')) {
                    if (localStorage.getItem('color-theme') === 'light') {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('color-theme', 'dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('color-theme', 'light');
                    }
                } else {
                    if (document.documentElement.classList.contains('dark')) {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('color-theme', 'light');
                    } else {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('color-theme', 'dark');
                    }
                }
            });
        </script>
    </body>
</html>
