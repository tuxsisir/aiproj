{% extends "account/base.html" %}

{% block account_content %}
<div class="text-center">
    <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-emerald-100 mb-4">
        {% heroicon_outline "check-circle" class="h-6 w-6 text-emerald-600" %}
    </div>
    <h2 class="text-2xl font-extrabold text-slate-900 mb-4">Password Changed!</h2>
    <p class="text-sm text-slate-600 mb-8">
        Your password has been successfully changed. You can now log in with your new password.
    </p>
    
    <a href="{% url 'account_login' %}" class="inline-flex w-full items-center justify-center rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 transition">
        Go to Login
    </a>
</div>
{% endblock %}
