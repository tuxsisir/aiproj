{% extends "account/base.html" %}
{% load socialaccount %}

{% block account_content %}
<div class="bg-white p-6 rounded shadow-sm border border-gray-200">
    <h1 class="text-2xl font-bold mb-4">Sign Up</h1>
    
    <form method="POST" action="{% url 'account_signup' %}" class="space-y-4">
        {% csrf_token %}
        
        {% if form.errors %}
            <div class="text-red-600 mb-4">{{ form.errors }}</div>
        {% endif %}
        
        <div>
            <label class="block font-medium mb-1">Email</label>
            <input type="email" name="email" class="w-full border border-gray-300 rounded px-3 py-2" required>
        </div>
        
        <div>
            <label class="block font-medium mb-1">Password</label>
            <input type="password" name="password" class="w-full border border-gray-300 rounded px-3 py-2" required>
        </div>
        
        <button type="submit" class="w-full px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Sign Up</button>
    </form>
    
    <div class="mt-4 pt-4 border-t border-gray-200">
        <a href="{% provider_login_url 'google' %}" class="block w-full text-center px-4 py-2 border border-gray-300 rounded hover:bg-gray-50">
            Sign up with Google
        </a>
    </div>
    
    <p class="mt-4 text-center text-sm">
        Already have an account? <a href="{% url 'account_login' %}" class="text-blue-600 hover:underline">Log in</a>
    </p>
</div>
{% endblock %}
