<div x-data="{ open: false }" class="relative w-full">
    <button @click="open = !open" @click.away="open = false" class="flex w-full items-center justify-between rounded-lg border border-slate-200 bg-white p-2 text-left hover:bg-slate-50 transition shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <div class="flex items-center gap-3">
            <div class="flex h-8 w-8 items-center justify-center rounded-md bg-slate-900 text-white shadow">
                {% heroicon_outline "building-office" class="h-4 w-4" %}
            </div>
            <div class="flex flex-col">
                <span class="text-sm font-semibold text-slate-900 leading-none mb-1">Kingsview Manor</span>
                <span class="text-xs text-slate-500 leading-none">Strata EPS 412</span>
            </div>
        </div>
        <div class="text-slate-400">
            {% heroicon_outline "chevron-up-down" class="h-4 w-4" %}
        </div>
    </button>

    <div x-show="open" style="display: none;"
         x-transition:enter="transition ease-out duration-100"
         x-transition:enter-start="transform opacity-0 scale-95"
         x-transition:enter-end="transform opacity-100 scale-100"
         x-transition:leave="transition ease-in duration-75"
         x-transition:leave-start="transform opacity-100 scale-100"
         x-transition:leave-end="transform opacity-0 scale-95"
         class="absolute left-0 right-0 top-full z-50 mt-2 rounded-lg border border-slate-200 bg-white shadow-lg overflow-hidden">
         
         <div class="px-3 py-2 text-[10px] font-bold text-slate-400 uppercase tracking-widest bg-slate-50 border-b border-slate-100">
             Strata Corporations
         </div>
         <div class="p-1">
             <button class="flex w-full items-center justify-between rounded-md px-2 py-1.5 text-sm font-medium text-slate-900 hover:bg-slate-100 transition">
                 <span>Kingsview Manor</span>
                 {% heroicon_outline "check" class="h-4 w-4 text-slate-900" %}
             </button>
             <button class="flex w-full items-center justify-between rounded-md px-2 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition">
                 <span>Riverside Complex</span>
             </button>
         </div>
         <div class="border-t border-slate-100 p-1">
             <button class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition">
                 {% heroicon_outline "plus" class="h-4 w-4" %}
                 Register New Strata Plan
             </button>
         </div>
    </div>
</div>
