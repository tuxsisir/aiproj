<div x-data="{ open: false }" class="relative w-full">
    <!-- Popover (Opens Downward) -->
    <div x-show="open" style="display: none;"
         @click.away="open = false"
         x-transition:enter="transition ease-out duration-100"
         x-transition:enter-start="transform opacity-0 -translate-y-2 scale-95"
         x-transition:enter-end="transform opacity-100 translate-y-0 scale-100"
         x-transition:leave="transition ease-in duration-75"
         x-transition:leave-start="transform opacity-100 translate-y-0 scale-100"
         x-transition:leave-end="transform opacity-0 -translate-y-2 scale-95"
         class="absolute top-full left-0 right-0 z-50 mt-2 rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-lg overflow-hidden origin-top">
         
         <div class="px-4 py-3 border-b border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800">
             <div class="text-sm font-semibold text-slate-900 dark:text-slate-100 truncate">{{ user.get_full_name|default:user.username }}</div>
             <div class="text-xs text-slate-500 dark:text-slate-400 truncate">{{ user.email }}</div>
         </div>
         <div class="p-1">
             <a href="{% url 'profile_edit' %}" class="flex w-full items-center rounded-md px-3 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-100 transition">
                 Profile Settings
             </a>
             <a href="#" class="flex w-full items-center rounded-md px-3 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-100 transition">
                 Notification Preferences
             </a>
         </div>
         <div class="border-t border-slate-100 dark:border-slate-800 p-1">
             <form method="post" action="{% url 'account_logout' %}">
                 {% csrf_token %}
                 <button type="submit" class="flex w-full items-center rounded-md px-3 py-2 text-sm font-medium text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-900/30 transition">
                     Sign Out
                 </button>
             </form>
         </div>
    </div>

    <!-- Trigger -->
    <button @click="open = !open" class="flex w-full items-center justify-between rounded-lg p-2 text-left hover:bg-slate-100 dark:hover:bg-slate-800 transition focus:outline-none focus:ring-2 focus:ring-blue-500">
        <div class="flex items-center gap-3 overflow-hidden">
            {% if user.avatar %}
                <img src="{{ user.avatar.url }}" alt="{{ user.username }}" class="h-9 w-9 shrink-0 rounded-full object-cover shadow-sm border border-slate-200 dark:border-slate-700">
            {% else %}
                <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full font-bold shadow-sm border border-transparent text-sm
                    {% if request.membership.role == 'MANAGER' %}
                        bg-emerald-100 text-emerald-700 ring-2 ring-emerald-500/20 dark:bg-emerald-950 dark:text-emerald-300
                    {% else %}
                        bg-indigo-100 text-indigo-700 ring-2 ring-indigo-500/20 dark:bg-indigo-950 dark:text-indigo-300
                    {% endif %}">
                    {{ user.username|make_list|first|upper }}
                </div>
            {% endif %}
            <div class="flex flex-col truncate">
                <span class="text-sm font-semibold text-slate-900 dark:text-slate-100 truncate">{{ user.get_full_name|default:user.username }}</span>
                {% if request.membership %}
                    <span class="text-[11px] font-medium mt-0.5 truncate
                        {% if request.membership.role == 'MANAGER' %}
                            text-emerald-600/90 dark:text-emerald-400
                        {% else %}
                            text-slate-500
                        {% endif %}">
                        {% if request.membership.role == 'PRESIDENT' %}
                            Council President
                        {% elif request.membership.role == 'MANAGER' %}
                            Strata Manager
                        {% elif request.membership.role == 'CARETAKER' %}
                            Building Staff
                        {% else %}
                            Council Member
                        {% endif %}
                    </span>
                {% else %}
                    <span class="text-[10px] uppercase font-bold tracking-wider text-slate-500 dark:text-slate-400 truncate mt-0.5">No Active Role</span>
                {% endif %}
            </div>
        </div>
        <div class="text-slate-400 shrink-0 ml-2">
            {% heroicon_outline "ellipsis-vertical" class="h-5 w-5" %}
        </div>
    </button>
</div>
