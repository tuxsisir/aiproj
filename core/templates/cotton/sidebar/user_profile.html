<div
    x-data="{ open: false }"
    @click.outside="open = false"
    @keydown.escape="if (open) { open = false; $refs.trigger.focus() }"
    class="relative w-full"
>
    <!-- Menu (opens upward from the bottom of the sidebar) -->
    <div
        id="user-menu"
        x-show="open"
        x-cloak
        x-transition.origin.bottom
        class="motion-reduce:transition-none absolute bottom-full left-0 right-0 z-50 mb-2 overflow-hidden rounded-lg border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 shadow-lg"
    >
        <div class="border-b border-slate-100 dark:border-slate-800 px-4 py-3">
            <div class="truncate text-xs text-slate-500 dark:text-slate-400">{{ user.email }}</div>
        </div>
        <div class="p-1">
            <a
                href="{% url 'profile_edit' %}"
                class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-100"
            >
                {% heroicon_outline "user-circle" class="h-4 w-4" %}
                Profile
            </a>
            <form
                method="post"
                action="{% url 'account_logout' %}"
            >
                {% csrf_token %}
                <button
                    type="submit"
                    class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-sm font-medium text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-900/30"
                >
                    {% heroicon_outline "arrow-right-on-rectangle" class="h-4 w-4" %}
                    Sign out
                </button>
            </form>
        </div>
    </div>

    <button
        type="button"
        x-ref="trigger"
        @click="open = !open"
        aria-haspopup="menu"
        aria-controls="user-menu"
        :aria-expanded="open"
        class="flex w-full items-center gap-3 rounded-lg p-2 text-left hover:bg-slate-100 dark:hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-400"
    >
        {% if user.avatar %}
            <img
                src="{% url 'my_avatar' %}?v={{ user.avatar.name|slugify }}"
                alt=""
                class="h-8 w-8 shrink-0 rounded-full object-cover"
            >
        {% else %}
            <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-slate-900 dark:bg-slate-100 text-xs font-semibold text-white dark:text-slate-900">
                {{ user.get_full_name|default:user.email|make_list|first|upper }}
            </span>
        {% endif %}
        <span class="flex min-w-0 flex-1 flex-col">
            <span class="truncate text-sm font-semibold text-slate-900 dark:text-slate-100">{{ user.get_full_name|default:user.email }}</span>
            <span class="truncate text-xs text-slate-500 dark:text-slate-400">{{ request.membership.title|default:"No active role" }}</span>
        </span>
        {% heroicon_outline "chevron-up-down" class="h-4 w-4 shrink-0 text-slate-400" %}
    </button>
</div>
