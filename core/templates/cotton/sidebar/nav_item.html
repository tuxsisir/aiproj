<c-vars
    href="#"
    icon="document"
    label=""
    badge=""
    active=""
    soon=""
/>
{% if soon %}
    <span
        title="{{ label }} is coming soon"
        class="flex items-center justify-between rounded-md px-3 py-1.5 text-sm text-slate-400 dark:text-slate-600 cursor-default"
    >
        <span class="flex items-center gap-3">
            {% heroicon_outline icon class="h-5 w-5 shrink-0" %}
            <span>{{ label }}</span>
        </span>
        <span class="rounded-full border border-slate-200 dark:border-slate-800 px-1.5 py-px text-[10px] font-medium uppercase tracking-wider">Soon</span>
    </span>
{% else %}
    <a
        href="{{ href }}"
        {% if active %}aria-current="page"{% endif %}
        class="relative flex items-center justify-between rounded-md px-3 py-1.5 text-sm font-medium transition
            {% if active %}
                bg-slate-900/[.06] text-slate-900 dark:bg-white/[.07] dark:text-white before:absolute before:-left-4 before:inset-y-1 before:w-[3px] before:rounded-r before:bg-amber-400
            {% else %}
                text-slate-600 dark:text-slate-400 hover:bg-slate-900/[.04] dark:hover:bg-white/[.05] hover:text-slate-900 dark:hover:text-slate-100
            {% endif %}"
    >
        <span class="flex items-center gap-3">
            <span class="{% if active %}text-slate-900 dark:text-amber-300{% else %}text-slate-400 dark:text-slate-500{% endif %}">
                {% heroicon_outline icon class="h-5 w-5 shrink-0" %}
            </span>
            <span>{{ label }}</span>
        </span>
        {% if badge %}
            <span class="inline-flex h-5 min-w-5 items-center justify-center rounded-full bg-amber-100 dark:bg-amber-900/40 px-1.5 text-[10px] font-bold text-amber-800 dark:text-amber-300">{{ badge }}</span>
        {% endif %}
    </a>
{% endif %}
