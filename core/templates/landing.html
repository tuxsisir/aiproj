{% extends "base_dashboard.html" %}

{% block content %}
<div class="text-center py-20">
    <h1 class="text-4xl font-bold mb-4">Welcome</h1>
    <p class="text-gray-600 mb-8">Minimal starting point.</p>
    
    {% if not user.is_authenticated %}
        <div class="space-x-4">
            <a href="{% url 'account_login' %}" class="px-4 py-2 border border-gray-300 rounded hover:bg-gray-100">Log in</a>
            <a href="{% url 'account_signup' %}" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Sign up</a>
        </div>
    {% endif %}
</div>
{% endblock %}
