{% if dev_accounts %}
<div class="rounded-lg border border-dashed border-amber-300 dark:border-amber-700 bg-amber-50/60 dark:bg-amber-950/30 p-3">
  <p class="text-[11px] font-bold uppercase tracking-wider text-amber-700 dark:text-amber-300 mb-2">Local dev · log in as</p>
  <div class="flex flex-wrap gap-1.5">
    {% for account in dev_accounts %}
      <form
        method="post"
        action="{% url 'dev_login_as' account.key %}"
      >
        {% csrf_token %}
        <button
          type="submit"
          title="{{ account.email }}"
          class="rounded-md px-2.5 py-1 text-xs font-semibold ring-1 transition
            {% if request.user.email == account.email %}bg-amber-600 text-white ring-amber-600{% else %}bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 ring-slate-300 dark:ring-slate-700 hover:bg-amber-100 dark:hover:bg-slate-800{% endif %}"
        >
          {{ account.label }}
        </button>
      </form>
    {% endfor %}
  </div>
</div>
{% endif %}
