{% extends "base_dashboard.html" %}

{% block content %}
<div class="bg-white p-6 rounded shadow-sm border border-gray-200 max-w-md">
    <h2 class="text-2xl font-bold mb-4">Edit Profile</h2>
    
    <form method="POST" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        
        <div>
            <label class="block font-medium mb-1">Avatar</label>
            {% if user.avatar %}
                <img src="{{ user.avatar.url }}" class="w-16 h-16 rounded object-cover mb-2" alt="Avatar">
            {% endif %}
            <input type="file" name="avatar" accept="image/*" class="w-full">
        </div>
        
        <div>
            <label class="block font-medium mb-1">First Name</label>
            <input type="text" name="first_name" value="{{ user.first_name }}" class="w-full border border-gray-300 rounded px-3 py-2">
        </div>
        
        <div>
            <label class="block font-medium mb-1">Last Name</label>
            <input type="text" name="last_name" value="{{ user.last_name }}" class="w-full border border-gray-300 rounded px-3 py-2">
        </div>
        
        <div>
            <label class="block font-medium mb-1">Email</label>
            <input type="email" value="{{ user.email }}" disabled class="w-full border border-gray-300 bg-gray-100 rounded px-3 py-2">
        </div>
        
        <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save</button>
    </form>
</div>
{% endblock %}
