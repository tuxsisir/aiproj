{% extends "base_dashboard.html" %}

{% block breadcrumb_active %}Profile Settings{% endblock %}

{% block content %}
<c-ui.card class="max-w-xl mx-auto mt-8 shadow-sm">
    <h2 class="text-2xl font-extrabold mb-6 tracking-tight text-slate-900 dark:text-slate-100">Edit Profile</h2>
    
    <form method="POST" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}
        
        <!-- Image Picker with Alpine.js Preview -->
        <div x-data="{ 
                photoName: null, 
                photoPreview: null,
                updatePreview(event) {
                    const file = event.target.files[0];
                    if (file) {
                        this.photoName = file.name;
                        const reader = new FileReader();
                        reader.onload = (e) => { this.photoPreview = e.target.result; };
                        reader.readAsDataURL(file);
                    }
                }
            }">
            
            <c-ui.label class="mb-2 block text-slate-700 dark:text-slate-300">Avatar</c-ui.label>
            
            <div class="flex items-center gap-4">
                <!-- Current or Preview Avatar -->
                <div x-show="!photoPreview" class="relative">
                    {% if user.avatar %}
                        <c-ui.avatar src="{{ user.avatar.url }}" alt="{{ user.username }}" size="xl" />
                    {% else %}
                        <div class="w-16 h-16 rounded-full bg-slate-200 dark:bg-slate-700 flex items-center justify-center text-slate-500 dark:text-slate-300 font-bold text-xl border border-slate-300 dark:border-slate-600">
                            {{ user.username|make_list|first|upper }}
                        </div>
                    {% endif %}
                </div>
                
                <div x-show="photoPreview" style="display: none;" class="relative">
                    <img :src="photoPreview" class="w-16 h-16 rounded-full object-cover shadow-sm border border-slate-200 dark:border-slate-700" />
                </div>

                <!-- File Input -->
                <div class="flex-1">
                    <c-ui.input 
                        type="file" 
                        name="avatar" 
                        accept="image/*" 
                        @change="updatePreview"
                        class="text-sm file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 dark:file:bg-slate-700 dark:file:text-slate-200"
                    />
                </div>
            </div>
        </div>
        
        <c-ui.field>
            <c-ui.label>First Name</c-ui.label>
            <c-ui.input name="first_name" value="{{ user.first_name }}" />
        </c-ui.field>
        
        <c-ui.field>
            <c-ui.label>Last Name</c-ui.label>
            <c-ui.input name="last_name" value="{{ user.last_name }}" />
        </c-ui.field>
        
        <c-ui.field>
            <c-ui.label>Email</c-ui.label>
            <c-ui.input type="email" value="{{ user.email }}" disabled />
        </c-ui.field>
        
        <c-ui.button type="submit" class="w-full">Save Profile</c-ui.button>
    </form>
</c-ui.card>
{% endblock %}
