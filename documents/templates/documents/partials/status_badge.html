<span class="shrink-0 px-2 py-0.5 rounded text-[11px] font-medium border
  {% if document.summary_status == 'READY' %}bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-950/40 dark:text-emerald-300 dark:border-emerald-800
  {% elif document.summary_status == 'FAILED' %}bg-rose-50 text-rose-700 border-rose-200 dark:bg-rose-950/40 dark:text-rose-300 dark:border-rose-800
  {% else %}bg-amber-50 text-amber-700 border-amber-200 dark:bg-amber-950/40 dark:text-amber-300 dark:border-amber-800{% endif %}">
  {% if document.summary_status == 'READY' %}Summarized{% else %}{{ document.get_summary_status_display }}{% endif %}
</span>
